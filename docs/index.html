<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlySafe Weather — Download</title>
  <meta name="description" content="Download the FlySafe Weather Android app for drone and aviation weather." />
  <meta property="og:title" content="FlySafe Weather" />
  <meta property="og:description" content="Drone and aviation weather — tap to download the Android app." />
  <meta property="og:image" content="flysafe_weather_splash.png" />
  <link rel="icon" href="flysafe_logo.png" />
  <style>
    :root {
      --navy: #0a1a33;
      --blue: #0b3d91;
      --sky: #4285f4;
      --foam: #f0f5ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--foam);
      background: var(--navy);
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 1.25rem 1.25rem 2rem;
      background:
        linear-gradient(180deg, rgba(10, 26, 51, 0.05) 0%, rgba(10, 26, 51, 0.35) 55%, rgba(10, 26, 51, 0.9) 100%),
        url("flysafe_weather_splash.png") center top / cover no-repeat;
    }

    main {
      width: min(22rem, 100%);
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.25rem;
      border-radius: 0.85rem;
      font: 700 1.05rem/1.2 "Segoe UI", system-ui, sans-serif;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--sky), var(--blue));
      color: var(--foam);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .btn-secondary {
      margin-top: 0.65rem;
      background: rgba(240, 245, 255, 0.14);
      color: var(--foam);
      border: 1px solid rgba(240, 245, 255, 0.3);
    }

    .btn:active { transform: scale(0.98); }

    .hint {
      margin: 0.85rem 0 0;
      font-size: 0.8rem;
      color: rgba(240, 245, 255, 0.7);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <a class="btn btn-primary" href="FlySafeWeather.apk">1. Download FlySafe Weather</a>

    <!-- Separate tap required — Chrome blocks opening Downloads without a direct user tap -->
    <a
      class="btn btn-secondary"
      href="intent://com.android.externalstorage.documents/document/primary%3ADownload#Intent;scheme=content;action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;end"
    >2. Open Downloads folder</a>

    <p class="hint">
      Chrome won’t open Downloads by itself. After the download finishes, tap button 2,
      then tap <strong>FlySafeWeather.apk</strong> → Install.<br /><br />
      Or in Chrome: <strong>⋮ menu → Downloads</strong>
    </p>
  </main>
</body>
</html>
